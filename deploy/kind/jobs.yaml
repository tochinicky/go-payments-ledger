# One-shot setup. Kubernetes doesn't order Jobs, so each one retries until what it needs is up, and ledger-api's
# readiness waits for the schema version itself rather than for these to finish.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: ledger
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: go-payments-ledger:dev
          imagePullPolicy: Never
          args: ["migrate"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: ledger-db, key: owner-url}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: login-roles
  namespace: ledger
data:
  # Dev-only passwords, matching secrets.example.yaml.
  setup.sql: |
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ledger_app') THEN
            CREATE ROLE ledger_app LOGIN PASSWORD 'ledger_app' IN ROLE ledger_writer;
        END IF;
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'notifier_app') THEN
            CREATE ROLE notifier_app LOGIN PASSWORD 'notifier_app' IN ROLE notifier_writer;
        END IF;
    END
    $$;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: login-roles
  namespace: ledger
spec:
  backoffLimit: 30   # retries until the migration has created the group roles
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:18-alpine
          # The SQL comes from a file: in a container's args, Kubernetes would read "$$" as an escaped "$".
          command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 \"$DATABASE_URL\" -f /sql/setup.sql"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: ledger-db, key: owner-url}}
          volumeMounts: [{name: sql, mountPath: /sql}]
      volumes:
        - name: sql
          configMap: {name: login-roles}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-topic
  namespace: ledger
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: relay
          image: go-payments-ledger:dev
          imagePullPolicy: Never
          command: ["/usr/local/bin/relay", "create-topic"]
          env:
            - {name: KAFKA_BROKERS, value: "redpanda:9092"}
