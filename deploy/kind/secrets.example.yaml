# A template: dev-only values for kind. A real deployment creates these from its secret store, never from a file
# in the repository.
apiVersion: v1
kind: Secret
metadata:
  name: ledger-db
  namespace: ledger
type: Opaque
stringData:
  owner-url: postgres://owner:owner@postgres:5432/ledger?sslmode=disable
  app-url: postgres://ledger_app:ledger_app@postgres:5432/ledger?sslmode=disable
  notifier-url: postgres://notifier_app:notifier_app@postgres:5432/ledger?sslmode=disable
  postgres-password: owner
