version: "2"
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: migrations
    queries: internal/relay/queries
    gen:
      go:
        package: relaydb
        out: internal/relay/relaydb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: migrations
    queries: internal/notifier/queries
    gen:
      go:
        package: notifierdb
        out: internal/notifier/notifierdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
