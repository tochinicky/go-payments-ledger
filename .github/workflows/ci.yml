name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The race detector on every run. The store, API and end-to-end tests start Postgres and Redpanda with
      # Testcontainers; GitHub's Linux runners have Docker.
      - run: go test -race -count=1 ./...

  # The store-vs-Book property test at 1,000 random sequences (default runs use rapid's 100, to keep them quick).
  property:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -run TestStoreAgreesWithTheBook ./internal/store/ -rapid.checks=1000 -v

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -ldflags "-X github.com/tochinicky/go-payments-ledger/internal/version.Commit=${GITHUB_SHA::7}" ./...
      # Crash points exist only in -tags faultinject builds. Prove the production binaries have none: check the
      # package path in the symbol table (function names can be inlined away; the package path can't hide).
      - name: no fault injection in production binaries
        run: |
          mkdir -p bin
          for cmd in ledger-api relay notifier; do
            go build -trimpath -o bin/$cmd ./cmd/$cmd
            if go tool nm bin/$cmd | grep -q 'internal/faultinject'; then
              echo "bin/$cmd contains internal/faultinject"; exit 1
            fi
          done
          go build -tags faultinject -o bin/relay-faultinject ./cmd/relay
          go tool nm bin/relay-faultinject | grep -q 'internal/faultinject'   # the check can see it when it's there

  # The container image: built (never pushed), so a broken Dockerfile fails CI.
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg COMMIT=${GITHUB_SHA::7} -t go-payments-ledger:ci .
      - run: docker run --rm --entrypoint /usr/local/bin/ledgerctl go-payments-ledger:ci 2>&1 | grep -q usage

